name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Placeholder values so the production build compiles without secrets.
          # This project is self-hosted on plain PostgreSQL (no Supabase); pages
          # that touch the database are dynamic and are not prerendered.
          SESSION_SECRET: placeholder-build-only-secret
          DATABASE_URL: postgresql://dbd:placeholder@localhost:5432/dbd
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
